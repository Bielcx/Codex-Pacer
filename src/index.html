<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Pacer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Codex Pacer</h1>
      <p class="remaining"><span id="percent">--</span>%</p>
      <p class="label">restante</p>
      <p class="verdict" id="verdict"></p>
      <svg id="chart" class="chart" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
      <p class="reset">Reset: <span id="reset">--</span></p>
      <p class="source" id="source"></p>
      <button id="refresh">Atualizar</button>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
