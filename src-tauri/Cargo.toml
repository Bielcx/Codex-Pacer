[package]
name = "codex-pacer"
version = "0.1.0"
description = "Tray app to track and pace OpenAI Codex CLI usage"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "codex-pacer"
path = "src/main.rs"
